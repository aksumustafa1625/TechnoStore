<template>
    <lightning-card title="Included Bundle Components" icon-name="utility:package">
        <lightning-button-icon
            slot="actions"
            icon-name="utility:refresh"
            alternative-text="Refresh"
            title="Refresh"
            onclick={handleRefresh}>
        </lightning-button-icon>

        <template if:true={hasBundles}>
            <template for:each={bundles} for:item="bundle">
                <div key={bundle.parentQliId} class="slds-p-horizontal_medium slds-p-bottom_medium">
                    <div class="slds-text-heading_small slds-p-bottom_x-small bundle-header">
                        {bundle.bundleProductName}
                        <span class="slds-text-body_small slds-text-color_weak">
                            &nbsp;— Bundle Price:
                            <lightning-formatted-number
                                value={bundle.bundleUnitPrice}
                                format-style="currency"
                                currency-code="USD">
                            </lightning-formatted-number>
                        </span>
                    </div>
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th>Component</th>
                                <th class="slds-text-align_center">Quantity</th>
                                <th class="slds-text-align_right">Price</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={bundle.components} for:item="comp">
                                <tr key={comp.Id}>
                                    <td>{comp.Component_Name__c}</td>
                                    <td class="slds-text-align_center">{comp.Quantity__c}</td>
                                    <td class="slds-text-align_right">
                                        <span class="slds-badge slds-badge_lightest">Included</span>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>
        </template>

        <template if:false={hasBundles}>
            <div class="slds-p-around_medium slds-text-color_weak slds-text-align_center">
                No bundle products on this quote.
            </div>
        </template>

        <template if:true={error}>
            <div class="slds-p-around_medium slds-text-color_error">
                Error loading components.
            </div>
        </template>
    </lightning-card>
</template>
